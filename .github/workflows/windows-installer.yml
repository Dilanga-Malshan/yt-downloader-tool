name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          New-Item -ItemType Directory -Force security | Out-Null
          python -m pip freeze | Out-File security/build-dependencies.txt -Encoding utf8
      - name: Audit Python dependencies
        shell: pwsh
        run: |
          python -m pip install pip-audit
          if ($LASTEXITCODE -ne 0) { throw 'Audit tool installation failed' }
          python -m pip_audit --strict --progress-spinner off --format json --output security/dependency-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed; installer will not be published' }
      - name: Check UI controls and layout
        run: python packaging/check_ui.py
      - name: Download and verify bundled tools
        shell: pwsh
        run: ./packaging/download_tools.ps1
      - name: Build desktop app
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name YT-Downloader-Pro --icon assets/product-icon.ico --add-data "assets;assets" --collect-all customtkinter --collect-all yt_dlp --collect-all yt_dlp_ejs --add-binary "vendor/ffmpeg.exe;." --add-binary "vendor/ffprobe.exe;." --add-binary "vendor/deno.exe;." --add-data "vendor/FFmpeg-LICENSE.txt;." --add-data "vendor/Deno-LICENSE.txt;." youtube_downloader.py
      - name: Smoke test bundled app
        shell: pwsh
        run: |
          & dist/YT-Downloader-Pro/_internal/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg failed' }
          & dist/YT-Downloader-Pro/_internal/deno.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Deno failed' }
          $app = Start-Process dist/YT-Downloader-Pro/YT-Downloader-Pro.exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw 'App exited during startup' }
          Stop-Process -Id $app.Id
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Get-FileHash installer/YT-Downloader-Pro-Setup.exe -Algorithm SHA256 | Format-List | Out-File installer/SHA256.txt
      - name: Scan app and installer for malware
        shell: pwsh
        run: ./packaging/scan_release.ps1
      - name: Include security reports
        shell: pwsh
        run: Copy-Item security installer/security -Recurse
      - name: Publish installer after security gates
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-Pro-Windows-Installer
          path: installer/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish diagnostic security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security/
          if-no-files-found: ignore
          retention-days: 90
