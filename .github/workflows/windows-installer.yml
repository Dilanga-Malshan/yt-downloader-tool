name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt "yt-dlp[default]"
      - name: Download bundled tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force vendor | Out-Null
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extracted
          $ffmpeg = Get-ChildItem ffmpeg-extracted -Directory | Select-Object -First 1
          Copy-Item "$($ffmpeg.FullName)/bin/ffmpeg.exe" vendor/
          Copy-Item "$($ffmpeg.FullName)/bin/ffprobe.exe" vendor/
          Copy-Item "$($ffmpeg.FullName)/LICENSE" vendor/FFmpeg-LICENSE.txt
          Invoke-WebRequest 'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip' -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath vendor
          Invoke-WebRequest 'https://raw.githubusercontent.com/denoland/deno/main/LICENSE.md' -OutFile vendor/Deno-LICENSE.txt
      - name: Build desktop app
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name YT-Downloader-Pro --collect-all customtkinter --collect-all yt_dlp --collect-all yt_dlp_ejs --add-binary "vendor/ffmpeg.exe;." --add-binary "vendor/ffprobe.exe;." --add-binary "vendor/deno.exe;." --add-data "vendor/FFmpeg-LICENSE.txt;." --add-data "vendor/Deno-LICENSE.txt;." youtube_downloader.py
      - name: Smoke test bundled app
        shell: pwsh
        run: |
          & dist/YT-Downloader-Pro/_internal/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg failed' }
          & dist/YT-Downloader-Pro/_internal/deno.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Deno failed' }
          $app = Start-Process dist/YT-Downloader-Pro/YT-Downloader-Pro.exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw 'App exited during startup' }
          Stop-Process -Id $app.Id
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Get-FileHash installer/YT-Downloader-Pro-Setup.exe -Algorithm SHA256 | Format-List | Out-File installer/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-Pro-Windows-Installer
          path: installer/*
          if-no-files-found: error
          retention-days: 90
